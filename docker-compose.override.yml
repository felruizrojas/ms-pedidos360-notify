# Solo local: compila la imagen desde el código y publica el SMTP de Mailpit (1025) en el host.
# Mailpit (definido en docker-compose.yml, UI en http://localhost:8025) se levanta con el perfil "mail":
#   docker compose --profile mail up   (con MAIL_ENABLED=true, MAIL_HOST=mailpit y MAIL_PORT=1025 en .env).
services:
  notify:
    build: .

  mailpit:
    ports:
      - "1025:1025"   # SMTP
