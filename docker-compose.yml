# Notificaciones (consumidor RabbitMQ). En la EC2 se usa este archivo tal cual (imagen de GHCR) y
# RabbitMQ vive en su propio clúster; en local se suma docker-compose.override.yml (compila la imagen).
# Variables: copiar .env.example a .env (en la EC2 el .env lo crea CloudFormation).
# Mailpit (SMTP falso con UI en el puerto 8025) solo se levanta con el perfil "mail": en local
# --profile mail; en la EC2, COMPOSE_PROFILES=mail en el .env. Va con MAIL_ENABLED=true y MAIL_HOST=mailpit.
services:
  notify:
    image: ${NOTIFY_IMAGE:-ghcr.io/felruizrojas/ms-pedidos360-notify:latest}
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:?falta RABBIT_ADDRESSES en .env}
      RABBIT_USERNAME: ${RABBIT_USERNAME:?falta RABBIT_USERNAME en .env}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?falta RABBIT_PASSWORD en .env}
      RABBIT_DECLARE_TOPOLOGY: ${RABBIT_DECLARE_TOPOLOGY:-true}
      RABBIT_CONNECTION_TIMEOUT: ${RABBIT_CONNECTION_TIMEOUT:-3s}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@pedidos360.cl}
      NOTIFY_MAX_INTENTOS: ${NOTIFY_MAX_INTENTOS:-3}
      NOTIFY_DLQ_LISTENERS: ${NOTIFY_DLQ_LISTENERS:-false}
    mem_limit: 512m
    # Rotación de logs: un error en bucle no puede llenar el disco de la EC2 (máx. 3 archivos de 10 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "8025:8025"   # UI web (notify le envía por SMTP al 1025 dentro de la red de Compose)
    mem_limit: 128m
    # Rotación de logs: un error en bucle no puede llenar el disco de la EC2 (máx. 3 archivos de 10 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
